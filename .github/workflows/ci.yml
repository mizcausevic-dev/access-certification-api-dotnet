name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore access-certification-api-dotnet.sln
      - name: Test
        run: dotnet test access-certification-api-dotnet.sln --configuration Release

# Least-privilege: read-only test/CI runs. GITHUB_TOKEN gets no write to
# anything. The publish/release flows (where they exist) carry their own
# scoped permissions per-workflow.
permissions:
  contents: read
