    <rect x="58" y="58" width="1284" height="110" rx="24" fill="#0b1220" stroke="rgba(120,255,170,.12)"/>
    <text x="94" y="96" fill="#37ff8b" font-size="14" font-weight="700" font-family="Consolas, monospace">
<tspan x="94" dy="0">ATTESTATION POSTURE</tspan>
</text>
    <text x="94" y="140" fill="#f5f7ff" font-size="38" font-weight="700" font-family="Georgia, serif">
<tspan x="94" dy="0">Attestation Posture</tspan>
</text>
    <text x="94" y="188" fill="#b8c6db" font-size="18" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="94" dy="0">Packet readiness, signoff blockers, and the next review window stay readable for IAM and</tspan>
<tspan x="94" dy="22">security operators.</tspan>
</text>
    
    
    <rect x="58" y="206" width="402" height="256" rx="20" fill="#0b1220" stroke="rgba(120,255,170,.18)" />
    <text x="86" y="242" fill="#ff5c7a" font-size="12" font-weight="700" font-family="Consolas, monospace">
<tspan x="86" dy="0">AC-12 · PRIVILEGED ADMIN PACKET</tspan>
</text>
    <text x="86" y="288" fill="#f5f7ff" font-size="30" font-weight="700" font-family="Georgia, serif">
<tspan x="86" dy="0">AC-12 · privileged</tspan>
<tspan x="86" dy="37">admin packet</tspan>
</text>
    <text x="86" y="338" fill="#b8c6db" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="86" dy="0">57 percent complete. Renewal stays</tspan>
<tspan x="86" dy="20">blocked until break-glass evidence</tspan>
<tspan x="86" dy="20">and reviewer notes are closed.</tspan>
</text>
    
    
    <rect x="498" y="206" width="402" height="256" rx="20" fill="#0b1220" stroke="rgba(120,255,170,.18)" />
    <text x="526" y="242" fill="#ffcc66" font-size="12" font-weight="700" font-family="Consolas, monospace">
<tspan x="526" dy="0">AC-18 · THIRD-PARTY ACCESS PACKET</tspan>
</text>
    <text x="526" y="288" fill="#f5f7ff" font-size="30" font-weight="700" font-family="Georgia, serif">
<tspan x="526" dy="0">AC-18 · third-party</tspan>
<tspan x="526" dy="37">access packet</tspan>
</text>
    <text x="526" y="338" fill="#b8c6db" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="526" dy="0">63 percent complete. Vendor guests</tspan>
<tspan x="526" dy="20">and service-account decisions are</tspan>
<tspan x="526" dy="20">still incomplete.</tspan>
</text>
    
    
    <rect x="938" y="206" width="404" height="256" rx="20" fill="#0b1220" stroke="rgba(120,255,170,.18)" />
    <text x="966" y="242" fill="#37ff8b" font-size="12" font-weight="700" font-family="Consolas, monospace">
<tspan x="966" dy="0">AC-27 · EVIDENCE REPLAY PACKET</tspan>
</text>
    <text x="966" y="288" fill="#f5f7ff" font-size="30" font-weight="700" font-family="Georgia, serif">
<tspan x="966" dy="0">AC-27 · evidence</tspan>
<tspan x="966" dy="37">replay packet</tspan>
</text>
    <text x="966" y="338" fill="#b8c6db" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="966" dy="0">73 percent complete. Renewal</tspan>
<tspan x="966" dy="20">posture is recoverable if linked</tspan>
<tspan x="966" dy="20">ticket evidence finishes on time.</tspan>
</text>
    
    
    <rect x="58" y="494" width="1284" height="288" rx="20" fill="#0b1220" stroke="rgba(120,255,170,.18)" />
    <text x="86" y="530" fill="#19c7ff" font-size="12" font-weight="700" font-family="Consolas, monospace">
<tspan x="86" dy="0">WHY THIS MONETIZES CLEANLY</tspan>
</text>
    <text x="86" y="576" fill="#f5f7ff" font-size="30" font-weight="700" font-family="Georgia, serif">
<tspan x="86" dy="0">Why this monetizes</tspan>
<tspan x="86" dy="37">cleanly</tspan>
</text>
    <text x="86" y="626" fill="#b8c6db" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="86" dy="0">Hosted preview planned gives a</tspan>
<tspan x="86" dy="20">public control-plane hook. Paid</tspan>
<tspan x="86" dy="20">templates can adapt campaign</tspan>
<tspan x="86" dy="20">fields and review lanes. Embedded</tspan>
<tspan x="86" dy="20">delivery fits enterprises that</tspan>
<tspan x="86" dy="20">need access-certification routing</tspan>
<tspan x="86" dy="20">inside Entra, Okta, or adjacent</tspan>
<tspan x="86" dy="20">identity stacks.</tspan>
</text>
    
    
    </svg>